[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-ipp"
version = "0.1.0"
description = "Reproducible Mars magnetic-field informative path planning"
requires-python = ">=3.10,<3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# Read compatibility ranges, not the environment lockfile.
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*Assigning the 'data' attribute.*:DeprecationWarning"]
